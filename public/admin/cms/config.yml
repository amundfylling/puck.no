# Sveltia CMS-konfigurasjon for puck.no
# Backend: GitHub via sveltia-cms-auth Cloudflare Worker (ingen Netlify).
# Innlogging krever GitHub OAuth-app (se REDIGERING.md / LAUNCH.md steg A5).
# CMS-et ligger på /admin/cms/ (adminportalen på /admin/ lenker dit).
backend:
  name: github
  repo: amundfylling/puck.no
  branch: main
  base_url: https://sveltia-cms-auth.amund-fylling.workers.dev # Cloudflare Worker (sveltia-cms-auth)
  auth_endpoint: /auth

site_url: https://www.puck.no
locale: 'no'
logo_url: /favicon.png

# CMS-opplastinger må være committet for at Cloudflare-bygg skal se dem.
# prebuild optimaliserer kilden til den offentlige /media/images-stien.
media_folder: media-uploads/images
public_folder: /media/images

publish_mode: simple # direkte commit til main (CMS-brukere); utviklere bruker PR

# Gyldig slug: små bokstaver, tall, norske tegn og bindestreker.
_slug_pattern: &slug_pattern '^[a-z0-9æøå]+(-[a-z0-9æøå]+)*$'
_slug_message: &slug_message 'Kun små bokstaver, tall, norske tegn (æøå) og bindestreker — f.eks. nm-2027-forhandstips'

collections:
  - name: tricks
    label: Bordhockeykombinasjoner
    label_singular: Kombinasjon
    description: 'Én strukturert kilde for den norske og engelske kombinasjonskatalogen.'
    folder: src/content/tricks
    create: true
    delete: false
    format: json
    extension: json
    slug: '{{fields.slug}}'
    identifier_field: name
    preview_path: /kombinasjoner/{{fields.slug}}
    summary: '{{name}} — grad {{difficulty}}'
    sortable_fields: [order, name, difficulty]
    view_groups:
      - { label: Spiller, field: players }
      - { label: Vanskelighetsgrad, field: difficulty }
    fields:
      - { label: Navn, name: name, widget: string }
      - label: Slug (URL)
        name: slug
        widget: string
        pattern: ['^[a-z0-9]+(-[a-z0-9]+)*$', 'Kun små ASCII-bokstaver, tall og bindestreker — f.eks. fakie-spjass']
        hint: 'Brukes i både /kombinasjoner/<slug>/ og /en/combinations/<slug>/.'
      - label: Alternative navn
        name: aliases
        widget: list
        required: false
        field: { label: Navn, name: alias, widget: string }
      - label: Spillere
        name: players
        widget: select
        multiple: true
        min: 1
        options:
          - { label: Senter, value: center }
          - { label: Høyreving, value: right-wing }
          - { label: Venstreving, value: left-wing }
          - { label: Høyreback, value: right-defense }
          - { label: Venstreback, value: left-defense }
          - { label: Keeper, value: goalie }
      - { label: Vanskelighetsgrad (0–10), name: difficulty, widget: number, value_type: int, min: 0, max: 10 }
      - label: Forklaringer
        name: description
        widget: object
        fields:
          - { label: Norsk, name: no, widget: text }
          - { label: Engelsk, name: en, widget: text }
      - label: Redigerbar illustrasjon
        name: illustration
        widget: string
        required: false
        hint: 'Slug i src/content/illustrations, vanligvis samme som kombinasjonen. Opprettes i Illustrasjonsverkstedet.'
      - { label: Eldre illustrasjonsbilde, name: diagram, widget: image, required: false }
      - { label: Video-URL, name: videoUrl, widget: string, required: false }
      - label: Gammelt lenkeanker
        name: legacyAnchor
        widget: string
        required: false
        hint: 'Bevarer gamle #lenker. La feltet stå tomt for nye kombinasjoner.'
      - { label: Rekkefølge, name: order, widget: number, value_type: int, min: 1 }

  - name: posts_no
    label: Nyheter (norsk)
    label_singular: Nyhetsartikkel
    description: 'Norske nyhetsartikler på forsiden og i bloggen.'
    folder: src/content/posts
    create: true
    delete: false
    slug: '{{fields.slug}}'
    preview_path: /post/{{fields.slug}}
    summary: '{{title}} — {{pubDate}}'
    sortable_fields: [pubDate, title]
    view_filters:
      - { label: Turneringsreferat, field: categories, pattern: Turneringsreferat }
      - { label: Forhåndstips, field: categories, pattern: Forhåndstips }
      - { label: Adventskalender, field: categories, pattern: Adventskalender }
    fields:
      - { label: Tittel, name: title, widget: string }
      - label: Slug (URL)
        name: slug
        widget: string
        pattern: [*slug_pattern, *slug_message]
        hint: 'Kun små bokstaver, tall og bindestreker — f.eks. nm-2027-forhandstips'
      - { label: Språk, name: lang, widget: hidden, default: 'no' }
      - { label: Forfatter, name: author, widget: string }
      - { label: Publiseringsdato, name: pubDate, widget: datetime, date_format: 'YYYY-MM-DD', time_format: 'HH:mm', picker_utc: false }
      - label: Kategorier
        name: categories
        widget: select
        multiple: true
        required: false
        options: [Turneringsreferat, Adventskalender 2024, Forhåndstips]
      - { label: Forsidebilde, name: cover, widget: image, required: false }
      - { label: Ingress, name: description, widget: text, required: false }
      - { label: Innhold, name: body, widget: markdown }

  - name: posts_en
    label: Nyheter (engelsk)
    label_singular: News article
    description: 'Engelske speil av norske artikler. Slug-paret må registreres i postMirrorsNoToEn av en utvikler.'
    folder: src/content/posts/en
    create: true
    delete: false
    slug: '{{fields.slug}}'
    preview_path: /en/post/{{fields.slug}}
    summary: '{{title}} — {{pubDate}}'
    sortable_fields: [pubDate, title]
    fields:
      - { label: Tittel, name: title, widget: string }
      - label: Slug (URL)
        name: slug
        widget: string
        pattern: [*slug_pattern, *slug_message]
        hint: 'Engelsk variant av den norske slugen; legg paret til i postMirrorsNoToEn (utvikler)'
      - { label: Språk, name: lang, widget: hidden, default: 'en' }
      - { label: Forfatter, name: author, widget: string }
      - { label: Publiseringsdato, name: pubDate, widget: datetime, date_format: 'YYYY-MM-DD', time_format: 'HH:mm', picker_utc: false }
      - label: Kategorier
        name: categories
        widget: select
        multiple: true
        required: false
        options: [Turneringsreferat, Adventskalender 2024, Forhåndstips]
      - { label: Forsidebilde, name: cover, widget: image, required: false }
      - { label: Ingress, name: description, widget: text, required: false }
      - { label: Innhold, name: body, widget: markdown }

  - name: tournaments
    label: Turneringer
    label_singular: Turnering
    description: 'Turneringssider med påmelding. Engelsk speil opprettes i «Turneringer (engelsk)».'
    folder: src/content/tournaments
    create: true
    delete: false
    slug: '{{fields.slug}}'
    preview_path: /turneringer/{{fields.slug}}
    summary: '{{name}} — {{date}}'
    sortable_fields: [date, name]
    view_groups:
      - { label: Kommende, field: status, pattern: upcoming }
      - { label: Tidligere, field: status, pattern: past }
    fields:
      - { label: Navn, name: name, widget: string }
      - label: Slug (URL)
        name: slug
        widget: string
        pattern: [*slug_pattern, *slug_message]
        hint: 'Blir /turneringer/<slug>. Kun små bokstaver, tall, bindestreker og norske tegn.'
      - label: Dato (visningstekst)
        name: date
        widget: string
        hint: 'Norsk datoformat, f.eks. «5. september 2026» eller «1.–3. mai 2026». Styrer om turneringen vises som kommende.'
      - label: Sted
        name: location
        widget: string
        required: false
        hint: 'La stå tom hvis arena ikke er kunngjort'
      - { label: Priser, name: prices, widget: text, required: false }
      - { label: Spillsystem, name: playingSystem, widget: text, required: false }
      - label: ITHF-rankingnivå
        name: rankingLevel
        widget: select
        required: false
        hint: 'Styrer beregnede ITHF-poeng for hver plassering. La stå tomt hvis poeng ikke skal vises. Nivå 1 har ulike garantier for VM og kontinentalmesterskap.'
        options:
          - { label: 'Nivå 1 – verdensmesterskap', value: '1-world' }
          - { label: 'Nivå 1 – kontinentalmesterskap', value: '1-continental' }
          - { label: 'Nivå 2', value: '2' }
          - { label: 'Nivå 3', value: '3' }
          - { label: 'Nivå 4', value: '4' }
          - { label: 'Nivå 5', value: '5' }
          - { label: 'Nivå 6', value: '6' }
          - { label: 'Nivå 10 – lagturnering (ingen poeng)', value: '10' }
      - label: SportScorpion-resultater
        name: results
        widget: object
        required: false
        collapsed: true
        hint: 'Koble turneringen til offisielle kampoppsett og resultater. Konfigureres bare her; den engelske siden bruker de samme ID-ene.'
        fields:
          - { label: Leverandør, name: provider, widget: hidden, default: sportscorpion }
          - label: Turnerings-ID
            name: tournamentId
            widget: number
            value_type: int
            min: 1
            hint: 'Tallet i SportScorpion-adressen, f.eks. 8171.'
          - label: Etapper
            name: stages
            widget: list
            required: false
            label_singular: Etappe
            summary: '{{fields.labelNo}}'
            hint: 'Valgfritt: nye etapper hentes automatisk fra SportScorpion. Legg dem inn her bare for norsk oversettelse og som reserve hvis SportScorpion er utilgjengelig under bygg.'
            fields:
              - label: Etappe-ID
                name: id
                widget: number
                value_type: int
                min: 1
                hint: 'Tallet i SportScorpion-adressen til etappen.'
              - label: Resultattype
                name: type
                widget: select
                options:
                  - { label: Sluttspilltre, value: bracket }
                  - { label: Tabell, value: table }
              - { label: Navn (norsk), name: labelNo, widget: string }
              - { label: Name (English), name: labelEn, widget: string }
      - label: Status
        name: status
        widget: select
        options:
          - { label: Kommende, value: upcoming }
          - { label: Tidligere, value: past }
        default: upcoming
        hint: 'Kun et hint — faktisk visning regnes ut fra datoen ved bygg.'
      - label: SportScorpion-resultater
        name: results
        widget: object
        required: false
        collapsed: true
        hint: 'Lenken vises øverst fra turneringsdagen. Den engelske siden bruker samme innstilling.'
        fields:
          - { label: Leverandør, name: provider, widget: hidden, default: sportscorpion }
          - label: Turnerings-ID
            name: tournamentId
            widget: number
            value_type: int
            min: 1
            hint: 'Tallet etter /tournament/id/ i SportScorpion-lenken, f.eks. 8171.'
      - label: Lenke til direktesending
        name: streamUrl
        widget: string
        required: false
        pattern: ['^https://', 'Bruk en fullstendig HTTPS-lenke.']
        hint: 'F.eks. en YouTube-lenke. Vises i forsidebanneret og øverst på turneringssiden fra turneringsdagen. Den engelske siden bruker samme lenke.'
      - label: Kladd / intern test
        name: draft
        widget: boolean
        default: false
        hint: 'På = siden, listene, sitemap og offentlig påmeldings-API utelater turneringen.'
      - label: Påmelding åpen
        name: registrationOpen
        widget: boolean
        default: true
        hint: 'Av = påmeldingsskjemaet skjules og nye påmeldinger avvises (f.eks. rett før turneringsstart).'
      - label: Spillere som teller for laget
        name: playersPerTeam
        widget: number
        required: false
        value_type: int
        min: 1
        hint: 'La stå tom for individuell turnering. For lag: antallet høyest rangerte spillere som skal telle i seedingen, f.eks. 3.'
      - label: Maks. innbyttere
        name: maxSubstitutes
        widget: number
        value_type: int
        min: 0
        default: 0
        hint: 'Ekstra, valgfrie spillere utover antallet som teller. Bruk 0 hvis innbyttere ikke er tillatt.'
      - label: Ekstra spørsmål i påmeldingen
        name: registrationQuestions
        widget: list
        required: false
        label_singular: Spørsmål
        summary: '{{fields.labelNo}}'
        hint: 'Ett svar per påmelding/lag. Svarene vises bare for administratorer.'
        fields:
          - label: Intern ID
            name: id
            widget: string
            pattern: ['^[a-z0-9][a-z0-9-]*$', 'Små bokstaver, tall og bindestrek, f.eks. lunsj-antall. Ikke endre ID etter at svar er mottatt.']
          - { label: Spørsmål (norsk), name: labelNo, widget: string }
          - { label: Question (English), name: labelEn, widget: string }
          - { label: Obligatorisk, name: required, widget: boolean, default: false }
          - label: Svaralternativer
            name: options
            widget: list
            min: 2
            label_singular: Svaralternativ
            summary: '{{fields.labelNo}}'
            fields:
              - { label: Lagret verdi, name: value, widget: string, hint: 'Kort og stabil verdi, f.eks. 0, 1 eller ja. Ikke endre etter at svar er mottatt.' }
              - { label: Tekst (norsk), name: labelNo, widget: string }
              - { label: Text (English), name: labelEn, widget: string }
      - label: Innhold (beskrivelse, tidsskjema)
        name: body
        widget: markdown

  - name: tournaments_en
    label: Turneringer (engelsk)
    label_singular: Engelsk turnering
    description: 'Engelske speil av norske turneringer. Bruk samme slug, dato og lagregler som den norske siden.'
    folder: src/content/tournaments/en
    create: true
    delete: false
    slug: '{{fields.slug}}'
    preview_path: /en/turneringer/{{fields.slug}}
    summary: '{{name}} — {{date}}'
    sortable_fields: [date, name]
    fields:
      - { label: Name, name: name, widget: string }
      - label: Slug (samme som norsk)
        name: slug
        widget: string
        pattern: [*slug_pattern, *slug_message]
        hint: 'Må være identisk med slug på den norske turneringen.'
      - { label: Språk, name: lang, widget: hidden, default: 'en' }
      - label: Date (same display value as Norwegian)
        name: date
        widget: string
        hint: 'Behold norsk maskinlesbart datoformat, f.eks. «5. september 2026»; siden viser det lokalisert.'
      - { label: Location, name: location, widget: string, required: false }
      - label: Parent tournament slug
        name: parent
        widget: string
        required: false
        pattern: [*slug_pattern, *slug_message]
      - { label: Prices, name: prices, widget: text, required: false }
      - { label: Playing system, name: playingSystem, widget: text, required: false }
      - label: ITHF ranking level (same as Norwegian)
        name: rankingLevel
        widget: select
        required: false
        options:
          - { label: 'Level 1 – World Championship', value: '1-world' }
          - { label: 'Level 1 – Continental Championship', value: '1-continental' }
          - { label: 'Level 2', value: '2' }
          - { label: 'Level 3', value: '3' }
          - { label: 'Level 4', value: '4' }
          - { label: 'Level 5', value: '5' }
          - { label: 'Level 6', value: '6' }
          - { label: 'Level 10 – team tournament', value: '10' }
      - label: Status hint
        name: status
        widget: select
        options:
          - { label: Upcoming, value: upcoming }
          - { label: Past, value: past }
        default: upcoming
      - { label: Draft / internal test (same as Norwegian), name: draft, widget: boolean, default: false }
      - { label: Registration open (same as Norwegian), name: registrationOpen, widget: boolean, default: true }
      - label: Players counted for team seeding
        name: playersPerTeam
        widget: number
        required: false
        value_type: int
        min: 1
        hint: 'Leave empty for an individual tournament; keep identical to Norwegian.'
      - { label: Maximum substitutes, name: maxSubstitutes, widget: number, value_type: int, min: 0, default: 0 }
      - label: Content (description and Schedule heading)
        name: body
        widget: markdown

  - name: pages_no
    label: Sider (norsk)
    description: 'Faste sider (forside, om oss, lær bordhockey, …). Nye sider opprettes av utvikler.'
    folder: src/content/pages
    create: false
    delete: false
    preview_path: /{{fields.slug}}
    summary: '{{title}}'
    sortable_fields: [title]
    fields:
      - { label: Tittel, name: title, widget: string }
      - label: Slug (URL)
        name: slug
        widget: string
        hint: 'Bestemmer adressen til siden — endres kun av utvikler (bryter menyer og lenker).'
      - { label: Språk, name: lang, widget: hidden, default: 'no' }
      - { label: Metabeskrivelse, name: description, widget: text, required: false }
      - { label: SEO-tittel, name: seoTitle, widget: string, required: false }
      - { label: Rekkefølge i meny, name: menuOrder, widget: number, required: false, value_type: int }
      - { label: Innhold, name: body, widget: markdown }

  - name: pages_en
    label: Sider (engelsk)
    description: 'Engelske speil av de faste sidene.'
    folder: src/content/pages/en
    create: false
    delete: false
    preview_path: /en/{{fields.slug}}
    summary: '{{title}}'
    sortable_fields: [title]
    fields:
      - { label: Tittel, name: title, widget: string }
      - label: Slug (URL)
        name: slug
        widget: string
        hint: 'Bestemmer adressen til siden — endres kun av utvikler (bryter menyer og lenker).'
      - { label: Språk, name: lang, widget: hidden, default: 'en' }
      - { label: Metabeskrivelse, name: description, widget: text, required: false }
      - { label: SEO-tittel, name: seoTitle, widget: string, required: false }
      - { label: Rekkefølge i meny, name: menuOrder, widget: number, required: false, value_type: int }
      - { label: Innhold, name: body, widget: markdown }

  - name: data
    label: Data
    files:
      - name: timers
        label: Timere (lydfiler)
        file: src/data/timers.json
        description: 'Kampklokker med musikk som brukes på turneringer. Last opp MP3 og legg til rad.'
        fields:
          - label: Timere
            name: timers
            widget: list
            root: true # timers.json er en topp-nivå liste
            label_singular: Timer
            fields:
              - { label: Tittel, name: title, widget: string }
              - label: Lydfil (MP3)
                name: file
                widget: file
                media_folder: public/media/audio
                public_folder: /media/audio
              - { label: Varighet (hint, f.eks. 05:38), name: duration_hint, widget: string, required: false }
      - name: documents
        label: Årsmøtedokumenter (PDF)
        file: src/data/documents.json
        description: 'Referat fra årsmøter. Last opp PDF og legg til rad.'
        fields:
          - label: Dokumenter
            name: documents
            widget: list
            root: true # documents.json er en topp-nivå liste
            label_singular: Dokument
            fields:
              - { label: Tittel, name: title, widget: string }
              - { label: År, name: year, widget: number, value_type: int }
              - label: PDF-fil
                name: file
                widget: file
                media_folder: public/media/pdf
                public_folder: /media/pdf
              - { label: Kildelenke (Wix, historisk), name: sourceUrl, widget: hidden, required: false }
              - { label: Side, name: page, widget: hidden, default: '/årsmøter', required: false }
