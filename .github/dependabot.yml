# Dependabot — hold npm-avhengigheter oppdaterte (ukentlig, mot main som PR)
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '06:00'
    open-pull-requests-limit: 5
    groups:
      safe-development-updates:
        dependency-type: development
        update-types: [minor, patch]
      safe-production-updates:
        dependency-type: production
        update-types: [minor, patch]
  - package-ecosystem: npm
    directory: /migration
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
    groups:
      safe-development-updates:
        dependency-type: development
        update-types: [minor, patch]
      safe-production-updates:
        dependency-type: production
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
    groups:
      safe-actions-updates:
        update-types: [minor, patch]
